    };

    function renderMatrix(domains) {
        // Collect which levels actually exist in the data
        const presentLevels = new Set();
        for (const domain of Object.values(domains)) {
            for (const role of domain.roles) presentLevels.add(role.level);
        }
        const cols = LEVEL_ORDER.filter(l => presentLevels.has(l));

        // Legend HTML
        const legendHtml = cols.map(l => `
            <span class="matrix-legend-item">
                <span class="badge ${badgeClass(l)}">${LEVEL_SHORT[l] || l}</span>
            </span>`).join('');

        // Table header
        const theadCols = cols.map(l => `
            <th><span class="matrix-th-badge badge ${badgeClass(l)}">${LEVEL_SHORT[l] || l}</span></th>
        `).join('');

        // Table body — one row per domain
        const tbodyRows = Object.entries(domains).map(([key, domain]) => {
            const icon = ICONS[key] || '📄';
            const cells = cols.map(level => {
                const matches = domain.roles.filter(r => r.level === level);
                if (matches.length === 0) {
                    return `<td class="matrix-cell"><span class="matrix-empty">—</span></td>`;
                }
                const chips = matches.map(r => `
                    <span class="matrix-chip badge ${badgeClass(r.level)}"
                          role="button" tabindex="0"
                          data-file="${escapeAttr(r.file)}"
                          data-title="${escapeAttr(r.title)}"
                          data-level="${escapeAttr(r.level)}"
                          data-domain="${escapeAttr(domain.label)}"
                          title="${escapeAttr(r.title)}">
                        ${r.title}
                    </span>`).join('');
                return `<td class="matrix-cell">${chips}</td>`;
            }).join('');

            return `<tr>
                <td class="matrix-domain-cell"><span>${icon}</span>${domain.label}</td>
                ${cells}
            </tr>`;
        }).join('');

        document.getElementById('matrixView').innerHTML = `
            <div class="matrix-header">
                <div>
                    <h2>📊 Role Matrix</h2>
                    <p>All ${Object.values(domains).reduce((n,d) => n + d.roles.length, 0)} roles across
                       ${Object.keys(domains).length} domains — click any role to open it.</p>
                </div>
                <div class="matrix-legend">${legendHtml}</div>
                <button class="btn-action" onclick="exportMatrixCsv()" aria-label="Download role matrix as CSV">⬇️ Export CSV</button>
            </div>
            <div class="matrix-scroll">
                <table class="matrix-table">
                    <thead>
                        <tr>
                            <th>Domain</th>
                            ${theadCols}
                        </tr>
                    </thead>
                    <tbody>${tbodyRows}</tbody>
                </table>
            </div>`;
    }

    function toggleMatrix() {
        matrixOpen = !matrixOpen;
        const mv  = document.getElementById('matrixView');
        const btn = document.getElementById('matrixBtn');
        btn.setAttribute('aria-pressed', String(matrixOpen));

        if (matrixOpen) {
            // Hide normal content and doc view, show matrix
            document.getElementById('welcomeState').style.display = 'none';
            document.getElementById('chapterView').style.display  = 'none';
            document.getElementById('rolesGrid').style.display    = 'none';
            document.getElementById('docView').style.display      = 'none';
            activeDoc = null;
            mv.style.display = '';
            mv.classList.add('show');
            btn.style.background = 'rgba(255,255,255,0.3)';
            btn.style.borderColor = 'rgba(255,255,255,0.6)';
            renderMatrix(allDomains);
            renderSidebar(allDomains, document.getElementById('searchInput').value);

            // Matrix and stale panel are mutually exclusive
            if (staleOpen) { staleOpen = false; document.getElementById('staleView').classList.remove('show'); document.getElementById('staleBtn').setAttribute('aria-pressed', 'false'); }
        } else {
            // Restore normal content
            document.getElementById('rolesGrid').style.display = '';
            mv.classList.remove('show');
            btn.style.background = '';
            btn.style.borderColor = '';
            // Show welcome if no role loaded
            if (!activeFile) document.getElementById('welcomeState').style.display = '';
        }
    }

    // ── Stale-role tracking: flag roles with no review date or one
    //    older than STALE_MONTHS ───────────────────────────
    function monthsSinceReview(lastReviewed, now = new Date()) {
        if (!lastReviewed) return null;
        const m = lastReviewed.match(/^(\d{4})-(\d{2})$/);
        if (!m) return null;
        const reviewed = new Date(Number(m[1]), Number(m[2]) - 1, 1);
        return (now.getFullYear() - reviewed.getFullYear()) * 12 + (now.getMonth() - reviewed.getMonth());
    }

    function computeStaleRoles(domains) {
        const now   = new Date();
        const stale = [];
        for (const domain of Object.values(domains)) {
            for (const role of domain.roles) {
                const monthsSince = monthsSinceReview(role.lastReviewed, now);
                if (monthsSince === null || monthsSince >= STALE_MONTHS) {
                    stale.push({ ...role, domainLabel: domain.label, monthsSince });
                }
            }
        }
        return stale.sort((a, b) => (b.monthsSince ?? 9999) - (a.monthsSince ?? 9999));
    }

    function updateStaleButton(domains) {
        const stale = computeStaleRoles(domains);
        const btn   = document.getElementById('staleBtn');
        if (stale.length === 0) { btn.style.display = 'none'; return; }
        btn.style.display  = '';
        btn.textContent    = `⏰ Stale (${stale.length})`;
        btn.setAttribute('aria-label', `${stale.length} roles overdue for review`);
    }

    function toggleStalePanel() {
        staleOpen = !staleOpen;
        const sv  = document.getElementById('staleView');
        const btn = document.getElementById('staleBtn');
        btn.setAttribute('aria-pressed', String(staleOpen));

        if (staleOpen) {
            document.getElementById('welcomeState').style.display = 'none';
            document.getElementById('chapterView').style.display  = 'none';
            document.getElementById('rolesGrid').style.display    = 'none';
            document.getElementById('docView').style.display      = 'none';
            activeDoc = null;
            sv.style.display = '';
            sv.classList.add('show');
            renderStalePanel(allDomains);

            // Matrix and stale panel are mutually exclusive
            if (matrixOpen) {
                matrixOpen = false;
                document.getElementById('matrixView').classList.remove('show');
                document.getElementById('matrixBtn').setAttribute('aria-pressed', 'false');
                document.getElementById('matrixBtn').style.background  = '';
                document.getElementById('matrixBtn').style.borderColor = '';
            }
        } else {
            sv.classList.remove('show');
            if (!activeFile) document.getElementById('welcomeState').style.display = '';
        }
    }

    function renderStalePanel(domains) {
        const stale = computeStaleRoles(domains);
        const rows = stale.map(r => `
            <tr>
                <td class="matrix-domain-cell">${r.domainLabel}</td>
                <td><span class="matrix-chip badge ${badgeClass(r.level)}"
                        role="button" tabindex="0"
                        data-file="${escapeAttr(r.file)}" data-title="${escapeAttr(r.title)}"
                        data-level="${escapeAttr(r.level)}" data-domain="${escapeAttr(r.domainLabel)}">${r.title}</span></td>
                <td>${r.lastReviewed || '<em>Not set</em>'}</td>
                <td>${r.monthsSince === null ? '—' : r.monthsSince + ' mo'}</td>
            </tr>`).join('');

        document.getElementById('staleView').innerHTML = `
            <div class="matrix-header">
                <div>
                    <h2>⏰ Roles Overdue for Review</h2>
                    <p>${stale.length} of ${Object.values(domains).reduce((n,d) => n + d.roles.length, 0)} roles
                       have no review date or were last reviewed ${STALE_MONTHS}+ months ago — click any role to open it.</p>
                </div>
                <button class="btn-action" onclick="exportStaleCsv()" aria-label="Download overdue role list as CSV">⬇️ Export CSV</button>
            </div>
            <div class="matrix-scroll">
                <table class="matrix-table">
                    <thead><tr><th>Domain</th><th>Role</th><th>Last Reviewed</th><th>Age</th></tr></thead>
                    <tbody>${rows || '<tr><td colspan="4">No stale roles 🎉</td></tr>'}</tbody>
                </table>
            </div>`;
    }

    function exportStaleCsv() {
        const stale = computeStaleRoles(allDomains);
        const rows  = [['Domain', 'Role Title', 'Level', 'Last Reviewed', 'Months Since Review']];
        for (const r of stale) rows.push([r.domainLabel, r.title, r.level, r.lastReviewed || '', r.monthsSince ?? '']);
        const csv = rows.map(r => r.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')).join('\r\n');
        downloadText('stale-roles.csv', csv, 'text/csv;charset=utf-8');
    }

    // ── Intercept .md links inside rendered doc/role content ─
    document.getElementById('mainArea').addEventListener('click', e => {
        const a = e.target.closest('a[href]');
        if (!a) return;
        const href = a.getAttribute('href');
        if (!href || !href.endsWith('.md')) return;
        e.preventDefault();

        // Resolve the link relative to the currently open doc/role, then route.
        const clean = resolveDocHref(href);

        if (clean.startsWith('Roles/')) {
            // Look up role metadata from allDomains
            const allRoles = Object.values(allDomains).flatMap(d =>
                d.roles.map(r => ({ ...r, domainLabel: d.label }))
            );
            const match = allRoles.find(r =>
                r.file === clean || r.file.replace(/\\/g, '/') === clean
            );
            if (match) {
                openRole(match.file, match.title, match.level, match.domainLabel);
            } else {
                // Fallback: open with just the filename as title
                const title = clean.split('/').pop().replace(/_/g, ' ').replace('.md', '');
                openRole(clean, title, '', '');
            }
        } else if (clean.startsWith('docs/')) {
            const title = clean.split('/').pop().replace(/_/g, ' ').replace('.md', '');
            openDoc(clean, title);
        }
    });

    // ── Delegated click handler for role items ───────────
    document.getElementById('sidebarNav').addEventListener('click', e => {
        // Cancel button on the compare banner
        if (e.target.closest('.compare-banner-x')) { cancelCompare(); return; }

        // Resource doc items
        const resItem = e.target.closest('.resource-item');
        if (resItem) {
            openDoc(resItem.dataset.doc, resItem.dataset.docTitle);
            return;
        }

        const item = e.target.closest('.role-item');
        if (!item) return;

        if (compareMode) {
            openCompareRole(item.dataset.file, item.dataset.title, item.dataset.level, item.dataset.domain);
        } else {
            openRole(item.dataset.file, item.dataset.title, item.dataset.level, item.dataset.domain);
        }
    });

    // ── Matrix chip clicks (single delegated listener) ───
    document.getElementById('matrixView').addEventListener('click', e => {
        const chip = e.target.closest('.matrix-chip');
        if (!chip) return;
        openRole(chip.dataset.file, chip.dataset.title, chip.dataset.level, chip.dataset.domain);
        const fileKey = chip.dataset.file.split('/')[1];
        setTimeout(() => {
            const dg = document.getElementById(`dg-${fileKey}`);
            if (dg && !dg.classList.contains('open')) dg.classList.add('open');
            document.querySelector(`.role-item[data-file="${chip.dataset.file}"]`)
                ?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 150);
    });

    // ── Stale-panel chip clicks (single delegated listener) ─
    document.getElementById('staleView').addEventListener('click', e => {
        const chip = e.target.closest('.matrix-chip');
        if (!chip) return;
        openRole(chip.dataset.file, chip.dataset.title, chip.dataset.level, chip.dataset.domain);
    });

    // ── Keyboard activation for role="button" elements ───
    // Sidebar items, matrix/stale chips, domain/chapter headers, and chapter
    // panel cards are divs/spans promoted with role="button"; Enter and Space
    // must activate them like real buttons. One delegated handler covers all
    // current and re-rendered elements.
    document.body.addEventListener('keydown', e => {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        const el = e.target.closest('[role="button"]');
        if (!el) return;
        e.preventDefault(); // keep Space from scrolling the page
        el.click();
    });

    // ── Boot ─────────────────────────────────────────────
    init();
</script>
</body>
</html>
