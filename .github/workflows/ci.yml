name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Least-privilege default: this workflow only checks out code, runs tests,
# and lints -- it never pushes, comments, or writes releases.
permissions:
  contents: read

jobs:
  test:
    name: Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18', '22']
    steps:
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-node v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test

  validate:
    name: Role content validation
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-node v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '18'
      - run: npm run validate
      - run: npm run check-counts

  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # DavidAnson/markdownlint-cli2-action v24
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff
        with:
          globs: |
            **/*.md

  browser:
    name: Browser journeys (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    # Maintainer-approved escape hatch for browser-irrelevant PRs; see #277.
    env:
      BROWSER_WAIVED: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'browser-not-required') }}
    # Fresh hosted runners may need to provision more than 100 MB of browser
    # system dependencies. Keep a ceiling, but leave enough room for a slow
    # Ubuntu mirror before the cross-browser tests begin (#206).
    timeout-minutes: 30
    steps:
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Record maintainer browser-test waiver
        if: env.BROWSER_WAIVED == 'true'
        run: |
          echo "::notice title=Browser tests waived::The maintainer applied the browser-not-required label."
      # actions/setup-node v6
      - name: Set up Node for browser tests
        if: env.BROWSER_WAIVED != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install browser test dependencies
        if: env.BROWSER_WAIVED != 'true'
        run: npm ci
      - name: Install browser engines
        if: env.BROWSER_WAIVED != 'true'
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run browser journeys
        if: env.BROWSER_WAIVED != 'true'
        run: npm run test:browser
      # actions/upload-artifact v4
      - name: Upload browser failure artifacts
        if: failure() && env.BROWSER_WAIVED != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
